# Memória para o Gradle/Loom (decompilação precisa de mais de 1G)
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Desligado de propósito: o build lê a pasta libs/ e o cache de configuração pode não perceber jars novos.
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# REGRA DE OURO: loom_version >= o MAIOR Loom que compilou qualquer jar em libs/.
# Hoje o mais novo é o GeckoLib 4.9.3 (Loom 1.17.21 + Gradle 9.7.1).
#   DAOT 2.4.x -> Loom 1.14.10 | GeckoLib 4.9.3 -> 1.17.21 | PlayerAnim 1.1.6 -> 1.11.458
#   los_gear   -> Loom 1.10.5
# NÃO suba para Loom 1.18+ (exige JDK 25 para rodar o Gradle).
# Se aparecer "Mod was built with a newer version of Loom (X)", suba loom_version para X
# e ajuste o Gradle em gradle/wrapper/gradle-wrapper.properties conforme o Loom exigir.
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.17.21
fabric_api_version=0.116.17+1.21.1

# Seu mod
version=0.1.0
group=com.example
archives_base_name=los-gear-plus
